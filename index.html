<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tr. Winnie's 單字狼人殺系統 V3 - 連線版</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: #1a1c28;
            --accent-red: #e94560;
            --accent-green: #2ecc71;
            --gold: #f1c40f;
            --text: #ffffff;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .view-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #2a2d3d;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h2, h3 { margin-top: 0; color: var(--gold); text-align: center; }
        .mode-select { display: flex; gap: 15px; margin: 20px 0; justify-content: center; }
        .mode-btn { padding: 15px 30px; font-size: 18px; background: #222533; border: 2px solid #444; color: white; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .mode-btn.active { border-color: var(--gold); background: #2c3045; box-shadow: 0 0 10px rgba(241,196,15,0.3); }

        textarea {
            width: 100%; height: 70px; background: #222533; border: 1px solid #444;
            color: white; padding: 8px; border-radius: 6px; box-sizing: border-box; resize: none;
        }
        .setup-row { display: flex; gap: 10px; margin: 15px 0; align-items: center; justify-content: space-between; }
        input[type="number"] { width: 60px; background: #222533; border: 1px solid #444; color: white; padding: 5px; text-align: center; border-radius: 4px; }
        
        button {
            background-color: var(--accent-red); color: white; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; font-size: 16px;
        }
        button:hover { opacity: 0.9; }

        /* 玩家列表 */
        .player-list-phone { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .player-row-phone {
            background: #222533; padding: 14px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            border-left: 5px solid #444;
        }
        .player-row-phone.alive { border-left-color: var(--accent-green); }
        .player-row-phone.dead { border-left-color: var(--accent-red); background: #1a1215; }
        .status-badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .status-alive { background: rgba(46, 204, 113, 0.2); color: var(--accent-green); }
        .status-dead { background: rgba(233, 69, 96, 0.2); color: var(--accent-red); }

        /* 隱密彈開面板 */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: #2c3045; border: 3px solid var(--gold);
            border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box; z-index: 100;
        }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99; }
        .hidden { display: none !important; }

        /* 大螢幕端樣式 */
        .screen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; width: 100%; }
        .screen-card {
            background: #1f212d; border: 2px solid #333; border-radius: 8px;
            padding: 20px; text-align: center; position: relative;
        }
        .screen-card.dead { background: #2d181c; border-color: var(--accent-red); opacity: 0.5; }
        .screen-card.dead::after {
            content: "復活區"; position: absolute; bottom: 5px; right: 5px;
            font-size: 11px; background: var(--accent-red); color: white; padding: 2px 5px; border-radius: 3px;
        }
        .p-num { font-size: 28px; font-weight: bold; color: var(--gold); margin-bottom: 5px; }
        .p-name { font-size: 18px; font-weight: bold; }

        .flow-display { font-size: 32px; font-weight: bold; color: #54a0ff; margin: 15px 0; text-shadow: 0 0 10px rgba(84,160,255,0.4); text-align: center; }
    </style>
</head>
<body>

    <h1 style="color:var(--gold); margin-bottom:5px;">🐺 Tr. Winnie's 單字狼人殺 V3 🐺</h1>
    
    <!-- 選擇這台裝置是手機還是電腦大螢幕 -->
    <div class="mode-select" id="modeSelector">
        <button class="mode-btn" onclick="selectMode('phone')">📱 我是手機 (控制端)</button>
        <button class="mode-btn" onclick="selectMode('screen')">🖥️ 我是電腦 (大螢幕)</button>
    </div>

    <!-- =============== 1. 老師手機端介面 =============== -->
    <div id="phoneView" class="view-container hidden">
        <h2>📱 老師掌上控制台</h2>
        <p style="font-size:12px; color:#aaa; text-align:center;">此畫面請留在手機，勿給學生看到身分</p>
        
        <div id="setupArea">
            <textarea id="namesInput" placeholder="輸入學生名字，可用逗號或換行隔開...&#10;例如：Tiffany, Andrea, Katrina, Kelly"></textarea>
            <div class="setup-row">
                <label>狼人總數：</label>
                <input type="number" id="wolfNum" value="2" min="1">
            </div>
            <button onclick="startGame()">⚔️ 初始化並排定編號</button>
        </div>

        <div id="controlArea" class="hidden">
            <div style="background:#222533; padding:10px; border-radius:8px; margin-bottom:15px;">
                <span style="font-size:12px; color:#aaa; display:block; text-align:center; margin-bottom:5px;">切換大螢幕流程狀態</span>
                <div style="display:flex; gap:8px;">
                    <button style="background:#54a0ff;" onclick="sendFlow('☀️ 天亮了！請進行單字小考與改卷 📝')">☀️ 天亮</button>
                    <button style="background:#57606f;" onclick="sendFlow('🌙 天黑請閉眼，身分發動技能中...')">🌙 天黑</button>
                    <button style="background:#ff6b6b;" onclick="sendFlow('🗳️ 投票時間！請指牌處決嫌疑人！')">🗳️ 投票</button>
                </div>
            </div>
            <h4 style="margin:5px 0; color:#aaa;">點擊學生改卷、升級、出局或復活：</h4>
            <div id="playerListPhone" class="player-list-phone"></div>
            <button style="background:#333; margin-top:20px; font-size:12px;" onclick="resetGameData()">重置整局遊戲</button>
        </div>
    </div>

    <!-- =============== 2. 教室大螢幕端介面 =============== -->
    <div id="screenView" class="view-container hidden" style="max-width:1000px; background:#0b0c10; border-color:var(--gold);">
        <h2>🖥️ 戰況即時看板</h2>
        <div id="screenFlow" class="flow-display">等待老師初始化遊戲...</div>
        <div class="screen-grid" id="screenGrid"></div>
    </div>

    <!-- 老師改卷隱密彈窗 -->
    <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal()"></div>
    <div id="secretModal" class="modal hidden">
        <h3 id="modalTitle">學生檔案</h3>
        <div style="background:#1a1c28; padding:15px; border-radius:8px; margin-bottom:15px; line-height: 1.6;">
            <div>初始陣營：<span id="mInitial" style="font-weight:bold;"></span></div>
            <div>目前身分：<span id="mCurrent" style="font-weight:bold; font-size:18px; color:#54a0ff;"></span></div>
            <div id="mSkill" style="font-size:13px; color:#aaa; margin-top:5px;"></div>
        </div>
        <div id="actionButtons" style="display:flex; flex-direction:column; gap:10px;"></div>
        <button style="background:#57606f; margin-top:10px;" onclick="closeModal()">關閉視窗</button>
    </div>

    <!-- 載入 Firebase 核心套件 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 💡 請把這裡的 databaseURL 換成你剛剛複製的那串網址
        const firebaseConfig = {
            databaseURL: "https://haowork-12-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("winnie_room");

        let players = [];
        let currentEditingIndex = null;
        let currentMode = '';

        const godPool = ['預言家', '女巫', '平民'];
        const alphaPool = ['白狼王', '狼美人', '狼人'];

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('modeSelector').classList.add('hidden');
            
            if (mode === 'phone') {
                document.getElementById('phoneView').classList.remove('hidden');
            } else {
                document.getElementById('screenView').classList.remove('hidden');
            }
            // 開始接聽資料庫同步訊號
            startListening();
        }

        function startListening() {
            db.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    players = [];
                    showSetupOrControl(false);
                    renderScreen([]);
                    document.getElementById('screenFlow').innerText = "等待老師初始化遊戲...";
                    return;
                }

                players = data.players || [];
                document.getElementById('screenFlow').innerText = data.currentFlow || "遊戲進行中";

                if (currentMode === 'phone') {
                    if (players.length > 0) {
                        showSetupOrControl(true);
                        renderPhoneList();
                    } else {
                        showSetupOrControl(false);
                    }
                } else if (currentMode === 'screen') {
                    renderScreen(players);
                }
            });
        }

        function showSetupOrControl(isGaming) {
            if (isGaming) {
                document.getElementById('setupArea').classList.add('hidden');
                document.getElementById('controlArea').classList.remove('hidden');
            } else {
                document.getElementById('setupArea').classList.remove('hidden');
                document.getElementById('controlArea').classList.add('hidden');
            }
        }

        function startGame() {
            const rawNames = document.getElementById('namesInput').value;
            const wolfCount = parseInt(document.getElementById('wolfNum').value);
            const names = rawNames.split(/[\n,，]+/).map(n => n.trim()).filter(n => n !== "");

            if(names.length < 4) { alert("人數太少囉！至少需要4人"); return; }
            if(wolfCount >= names.length / 2) { alert("狼人太多了！"); return; }

            let localPlayers = names.map((name, idx) => ({
                id: idx + 1,
                name: name,
                initial: 0, 
                currentRole: '平民',
                isAlive: true,
                isUpgraded: false
            }));

            let assigned = 0;
            while(assigned < wolfCount) {
                let ran = Math.floor(Math.random() * localPlayers.length);
                if(localPlayers[ran].initial === 0) {
                    localPlayers[ran].initial = 1;
                    localPlayers[ran].currentRole = '狼人';
                    assigned++;
                }
            }

            // 推送到雲端資料庫
            db.set({
                players: localPlayers,
                currentFlow: '☀️ 天亮了！請進行第1輪單字小考 📝'
            });
        }

        function sendFlow(text) {
            db.update({ currentFlow: text });
        }

        function renderPhoneList() {
            const phoneList = document.getElementById('playerListPhone');
            phoneList.innerHTML = '';
            players.forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = `player-row-phone ${p.isAlive ? 'alive' : 'dead'}`;
                row.onclick = () => openModal(idx);
                row.innerHTML = `
                    <div><strong>${p.id}號. ${p.name}</strong> <span style="font-size:11px; color:#aaa;">(${p.currentRole})</span></div>
                    <span class="status-badge ${p.isAlive ? 'status-alive' : 'status-dead'}">${p.isAlive ? '存活' : '出局'}</span>
                `;
                phoneList.appendChild(row);
            });
        }

        function renderScreen(playerData) {
            const screenGrid = document.getElementById('screenGrid');
            screenGrid.innerHTML = '';
            playerData.forEach(p => {
                const card = document.createElement('div');
                card.className = `screen-card ${p.isAlive ? '' : 'dead'}`;
                card.innerHTML = `
                    <div class="p-num">${p.id}號</div>
                    <div class="p-name">${p.name}</div>
                `;
                screenGrid.appendChild(card);
            });
        }

        function openModal(idx) {
            currentEditingIndex = idx;
            const p = players[idx];
            
            document.getElementById('modalTitle').innerText = `${p.id}號 【${p.name}】 的身分檔案`;
            document.getElementById('mInitial').innerText = p.initial === 0 ? '平民陣營 🧑‍🌾' : '狼人陣營 🐺';
            document.getElementById('mCurrent').innerText = p.currentRole;
            
            let skill = '無特殊技能。';
            if (p.currentRole === '預言家') skill = '🔮 每晚可查驗一人身分。';
            else if (p.currentRole === '女巫') skill = '🧪 擁有一瓶毒藥與一瓶解藥。';
            else if (p.currentRole === '白狼王') skill = '💥 白天發言時可隨時自爆，強行帶走一人。';
            else if (p.currentRole === '狼美人') skill = '💋 每晚魅惑一人，自己死時該人一同殉情。';
            document.getElementById('mSkill').innerText = skill;

            const btnArea = document.getElementById('actionButtons');
            btnArea.innerHTML = '';

            if (p.isAlive) {
                if (!p.isUpgraded) {
                    const upBtn = document.createElement('button');
                    upBtn.style.background = 'var(--gold)';
                    upBtn.style.color = 'black';
                    upBtn.innerText = '💯 單字全對 ➜ 抽卡升級！';
                    upBtn.onclick = triggerUpgrade;
                    btnArea.appendChild(upBtn);
                } else {
                    btnArea.innerHTML += `<div style="text-align:center; color:var(--gold); font-size:13px;">✨ 本局已是高級身分</div>`;
                }

                const killBtn = document.createElement('button');
                killBtn.style.background = 'var(--accent-red)';
                killBtn.innerText = '💀 宣布此人出局 (投死/毒死/殺死)';
                killBtn.onclick = () => changeStatus(false);
                btnArea.appendChild(killBtn);
            } else {
                const reviveBtn = document.createElement('button');
                reviveBtn.style.background = 'var(--accent-green)';
                reviveBtn.innerText = '❤️ 單字全對 ➜ 成功復活！(回復原始陣營)';
                reviveBtn.onclick = triggerRevive;
                btnArea.appendChild(reviveBtn);
            }

            document.getElementById('modalOverlay').classList.remove('hidden');
            document.getElementById('secretModal').classList.remove('hidden');
        }

        function triggerUpgrade() {
            const p = players[currentEditingIndex];
            if (p.initial === 0) {
                p.currentRole = godPool[Math.floor(Math.random() * godPool.length)];
            } else {
                p.currentRole = alphaPool[Math.floor(Math.random() * alphaPool.length)];
            }
            p.isUpgraded = true;
            db.update({ players: players });
            alert(`升級成功！${p.name} 變為：【${p.currentRole}】`);
            closeModal();
        }

        function triggerRevive() {
            const p = players[currentEditingIndex];
            p.isAlive = true;
            p.isUpgraded = false;
            p.currentRole = p.initial === 0 ? '平民' : '狼人';
            db.update({ players: players });
            alert(`❤️ 復活成功！${p.name} 已洗回原始身分：【${p.currentRole}】`);
            closeModal();
        }

        function changeStatus(alive) {
            players[currentEditingIndex].isAlive = alive;
            db.update({ players: players });
            closeModal();
        }

        function resetGameData() {
            if(confirm("確定要重置並清空當前賽局嗎？")) {
                db.set(null);
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('secretModal').classList.add('hidden');
        }
    </script>
</body>
</html>
